{% extends "base.html" %}

{% block content %}

<style>

    .chart-card{
    background:var(--card-color);
    padding:15px;
    border-radius:14px;
    margin-top:20px;
}

.chart-wrapper{
    max-width:250px;
    margin:20px auto 0 auto;
    height:250px;
}

@media (max-width: 480px) {
    .priority-high, .priority-medium, .priority-low {
        font-size: 14px; 
        padding: 8px 16px;
    }

    .chart-wrapper {
        max-width: 200px;
        height:200px;
    }

    .doughnut-container{
        height: 210px;
        max-width: 220px;
    }
}

/* Charts resize */
.chart-wrapper {
    max-width: 100%;
    height: 200px;
}

#weeklyChart {
    max-width: 100%;
    height: 200px;
}


.chart-container{
    position: relative;
    width: 100%;
    height: 320px;
    margin-bottom: 20px;
}

/* Smaller doughnut charts */
.doughnut-container{
    height: 240px;
    max-width: 280px;
    margin: 0 auto 20px auto;
}

.chart-container canvas{
    display:block;
}

</style>

<h2>📊 Analytics</h2>

<div class="chart-container doughnut-container">

    <canvas id="priorityChart"></canvas>

</div>

<div class="chart-container doughnut-container">

    <canvas id="completionChart"></canvas>

</div>

<div class="chart-card">

    <h3>📊 Productivity Overview</h3>

    <div class="chart-container">
    <canvas id="weeklyChart"></canvas>
    </div>

</div>

<script src="{{ url_for('static', filename='js/chart.js') }}"></script>

<script>

// Debounce helper to batch chart updates
let updateChartTimeout;
function scheduleChartUpdate(force = false) {
    if (updateChartTimeout) clearTimeout(updateChartTimeout);

    const delay = force ? 0 : 200; // 0ms if forced, 200ms otherwise
    updateChartTimeout = setTimeout(() => {
        fetch("/api/tasks")
            .then(res => {
                if (!res.ok) throw new Error("Request failed");
                return res.json();
            })
            .then(info => {

                // Weekly chart
                if (window.weeklyChart) {
                    weeklyChart.data.labels = [...info.days];
                    weeklyChart.data.datasets[0].data = [...info.weekly];
                    weeklyChart.update();
                }

                // Completion doughnut
                if (window.completionChart) {
                    completionChart.data.datasets[0].data = [
                        info.completed,
                        info.pending
                    ];
                    completionChart.update();
                }

                    // Priority doughnut
                    if (window.priorityChart) {

                        const high = Number(info.high) || 0;
                        const medium = Number(info.medium) || 0;
                        const low = Number(info.low) || 0;

                        const safeHigh = Number(info.high) || 0;
                        const safeMedium = Number(info.medium) || 0;
                        const safeLow = Number(info.low) || 0;

                        if (window.priorityChart) {
                            priorityChart.data.datasets[0].data = [
                                safeHigh,
                                safeMedium,
                                safeLow
                            ];

                            priorityChart.update();
                        }
                    }

            });
    }, delay);
}

if (typeof Chart === 'undefined') {
    console.error("Chart.js failed to load");
}

// Initial chart update on page load
document.addEventListener("DOMContentLoaded", () => {
    scheduleChartUpdate(true);
});

// Charts
document.addEventListener("DOMContentLoaded", function () {

const priorityCtx = document.getElementById('priorityChart');
const completionCtx = document.getElementById('completionChart');
const taskCtx = null;
const weeklyCtx = document.getElementById('weeklyChart');

window.taskChart = null;
window.weeklyChart = null;

window.priorityChart = null;
window.completionChart = null;

setTimeout(() => {

    if (priorityCtx && completionCtx) {

        window.priorityChart = new Chart(priorityCtx, {
            type: 'doughnut',
            data: {
                labels: ['High', 'Medium', 'Low'],
                datasets: [{
                    data: [1, 1, 1],
                    backgroundColor: ['#ef4444', '#f59e0b', '#22c55e'],
                    borderColor: '#ffffff',
                    borderWidth: 2,
                    hoverOffset:12
                }]
            },
            options: {
                responsive: true,
                maintainAspectRatio: false,
                cutout: '60%',
                plugins: {
                    legend: {
                        position: 'bottom'
                    }
                }
            }
        });

        console.log(
            "Priority canvas size:",
            priorityCtx.width,
            priorityCtx.height
        );

        window.completionChart = new Chart(completionCtx, {
            type: 'doughnut',
            data: {
                labels: ['Completed', 'Pending'],
                datasets: [{
                    data: [1, 1],
                    backgroundColor: ['#22c55e', '#ef4444'],
                    borderColor: '#ffffff',
                    borderWidth: 2,
                    hoverOffset:12
                }]
            },
            options: {
                responsive: true,
                maintainAspectRatio: false,
                cutout: '60%',
                plugins: {
                    legend: {
                        position: 'bottom'
                    }
                }
            }
        });

        console.log(
            "Completion canvas size:",
            completionCtx.width,
            completionCtx.height
        );
    }

    if (weeklyCtx) {


        window.weeklyChart = new Chart(weeklyCtx, {
            type:'bar',
            data:{ labels:[], datasets:[{label:'Tasks Completed', data:[], borderRadius:6, backgroundColor:'#6366f1'}] },
            options:{
                responsive:true,
                animation:false,
                plugins:{ legend:{ display:false } },
                scales:{
                    y:{
                        beginAtZero:true,
                        ticks:{ stepSize:1 }
                    }
                }
            }
        });

    }

}, 80);


function updateWeeklyChart(labels, data) {
    console.log("Weekly Chart Updating:", labels, data);

    if (!weeklyChart || !labels || !data) return;

    weeklyChart.data.labels = [...labels];
    weeklyChart.data.datasets[0].data = [...data];

    weeklyChart.update();
}

function updateCompletionChart(completed, pending) {

    if (!completionChart) return;

    completionChart.data.datasets[0].data = [
        completed,
        pending
    ];

    completionChart.update();
}

function updatePriorityChart(high, medium, low) {

    if (!priorityChart) return;

    priorityChart.data.datasets[0].data = [
        high,
        medium,
        low
    ];

    priorityChart.update();
}

// Make available globally
window.updateWeeklyChart = updateWeeklyChart;
window.updateCompletionChart = updateCompletionChart;
window.updatePriorityChart = updatePriorityChart;

});

// Charts update
        
        if (window.weeklyChart) {
            updateWeeklyChart(data.days, data.weekly);
        }


</script>

{% endblock %}
